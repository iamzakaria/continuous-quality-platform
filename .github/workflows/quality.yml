name: Repository quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: python -m pytest --junitxml=artifacts/junit.xml --cov=quality_platform --cov-report=xml:artifacts/coverage.xml --cov-fail-under=70
      - run: docker build -t continuous-quality-platform:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: artifacts/
          retention-days: 7
